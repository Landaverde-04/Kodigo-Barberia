{% if cita.estado == 'CONFIRMED' %}<span class="badge text-bg-success">{{ cita.get_estado_display }}</span>
{% elif cita.estado == 'CANCELLED' %}<span class="badge text-bg-secondary">{{ cita.get_estado_display }}</span>
{% else %}<span class="badge text-bg-primary">{{ cita.get_estado_display }}</span>{% endif %}
